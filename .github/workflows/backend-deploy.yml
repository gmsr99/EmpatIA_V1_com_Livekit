name: Deploy Backend EmpatIA 🤖

on:
  push:
    branches:
      - main
    paths:
      - 'Empatia_Backend_Clean/**' # Só dispara se mexeres na pasta do backend

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/empatia-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código 📥
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry 🔑
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem 🐳
        uses: docker/build-push-action@v5
        with:
          context: ./Empatia_Backend_Clean # A pasta onde está o Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push # Só corre se o build funcionar
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH na VPS 🚀
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Entrar na pasta do projeto
            cd /root/Empatia_Backend_Clean
            
            # 2. Descarregar a nova imagem
            docker pull ghcr.io/${{ github.repository_owner }}/empatia-backend:latest
            
            # 3. Recriar o contentor do backend (sem parar a base de dados!)
            docker compose up -d --no-deps empatia-backend
            
            # 4. Limpar imagens antigas para poupar espaço
            docker image prune -f